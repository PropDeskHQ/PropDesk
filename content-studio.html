<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PropDesk Content Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#e8e8e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;min-height:100vh}
a{color:inherit;text-decoration:none}
button,input,textarea,select{font-family:inherit;cursor:pointer}
input,textarea{cursor:text}

/* Gate */
#gate{position:fixed;inset:0;background:#0d0d0d;display:flex;align-items:center;justify-content:center;z-index:999}
.gate-card{background:#1a1a1a;border:1px solid #252525;border-radius:16px;padding:32px 28px;width:300px;text-align:center}
#pwInput{width:100%;background:#111;border:1px solid #2a2a2a;border-radius:8px;padding:9px 12px;color:#e8e8e8;font-size:14px;outline:none;margin-bottom:10px;cursor:text}
#pwInput:focus{border-color:#00e87a55}

/* Layout */
#main{display:none;max-width:1140px;margin:0 auto;padding:24px 16px 64px}
.cs-layout{display:grid;grid-template-columns:1fr 500px;gap:24px;align-items:start}
@media(max-width:920px){.cs-layout{grid-template-columns:1fr}}
@media(max-width:480px){
  #main{padding:14px 10px 48px}
  .panel{padding:12px}
  .picks-wrap{max-height:220px}
}

/* Panels */
.panel{background:#141414;border:1px solid #1e1e1e;border-radius:12px;padding:16px;margin-bottom:12px}
.panel:last-child{margin-bottom:0}
.slabel{font-size:10px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;display:block}

/* Pills */
.pill{border-radius:20px;padding:5px 13px;font-size:12px;font-weight:600;border:1px solid #252525;background:transparent;color:#555;transition:.12s;white-space:nowrap}
.pill.on{background:#0e1e0e;color:#00e87a;border-color:#00e87a44}
.pill:hover:not(.on){color:#aaa;border-color:#333}

/* Buttons */
.btn{border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;border:1px solid #2a2a2a;background:#1a1a1a;color:#888;transition:.12s}
.btn:hover:not(:disabled){color:#e8e8e8;border-color:#444}
.btn:disabled{opacity:.35;cursor:default}
.btn.accent{background:#00e87a;color:#000;border-color:transparent}
.btn.accent:hover:not(:disabled){background:#00d068}
.btn.sm{padding:4px 9px;font-size:11px}
.fmt-btn{border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;border:1px solid #252525;background:transparent;color:#555;transition:.12s}
.fmt-btn.on{background:#1a1a1a;color:#e8e8e8;border-color:#444}

/* Pick list */
.picks-wrap{max-height:300px;overflow-y:auto;margin-top:6px}
.pick-row{display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid #1b1b1b;cursor:pointer;transition:background .1s}
.pick-row:last-child{border-bottom:none}
.pick-row:hover{background:#1a1a1a}
.pick-row.sel{background:#0a1a0a}
.pick-row input[type=checkbox]{accent-color:#00e87a;width:14px;height:14px;flex-shrink:0;cursor:pointer}
.p-name{font-size:13px;font-weight:600;color:#ddd;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-line{font-size:12px;color:#00e87a;white-space:nowrap;flex-shrink:0}
.p-conf{font-size:11px;color:#555;white-space:nowrap;flex-shrink:0;min-width:30px;text-align:right}
.p-res{font-size:9px;font-weight:800;padding:2px 5px;border-radius:3px;white-space:nowrap;flex-shrink:0;text-transform:uppercase;letter-spacing:.04em}
.p-res.hit{background:#0e2818;color:#22c55e}
.p-res.miss{background:#2e0e0e;color:#ef4444}
.p-res.pending{background:#1a1a1a;color:#444}

/* Sync bar */
.sync-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#111;border:1px solid #1a1a1a;border-radius:8px;margin-top:8px}

/* Preview */
.prev-outer{background:#0e0e0e;border:1px solid #1a1a1a;border-radius:10px;display:flex;align-items:flex-start;justify-content:center;padding:20px;transition:min-height .2s;overflow:hidden}
.prev-container{position:relative;overflow:hidden;flex-shrink:0}
#prev-inner{position:absolute;top:0;left:0;transform-origin:top left}

/* Caption */
.cap-ta{width:100%;background:#111;border:1px solid #252525;border-radius:8px;padding:11px 12px;color:#e0e0e0;font-size:13px;line-height:1.65;resize:vertical;outline:none;min-height:86px;margin-top:6px}
.cap-ta:focus{border-color:#00e87a44}

/* Misc */
.cs-empty{color:#333;font-size:12px;text-align:center;padding:32px 0}
#act-status{font-size:11px;color:#00e87a;text-align:center;min-height:16px;margin-top:6px}
</style>
</head>
<body>

<!-- ═══ GATE ══════════════════════════════════════════════════════ -->
<div id="gate">
  <div class="gate-card">
    <div style="font-size:19px;font-weight:800;color:#fff;margin-bottom:3px">PROP<span style="color:#00e87a">DESK</span></div>
    <div style="font-size:11px;color:#444;margin-bottom:24px;letter-spacing:.08em;text-transform:uppercase">Content Studio</div>
    <input id="pwInput" type="password" placeholder="Password" autocomplete="current-password">
    <button onclick="checkPw()" style="width:100%;background:#00e87a;color:#000;border:none;border-radius:8px;padding:10px;font-size:14px;font-weight:700">Enter</button>
    <div id="pwErr" style="font-size:12px;color:#ef4444;margin-top:8px;display:none">Incorrect password</div>
  </div>
</div>

<!-- ═══ MAIN ═══════════════════════════════════════════════════════ -->
<div id="main">
  <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:20px">
    <div>
      <h1 style="font-size:20px;font-weight:800;color:#fff">PROP<span style="color:#00e87a">DESK</span> <span style="font-size:13px;font-weight:400;color:#444">Content Studio</span></h1>
      <p style="font-size:12px;color:#333;margin-top:2px">Generate branded social graphics from your tracked picks</p>
    </div>
    <a href="index.html" style="font-size:12px;color:#444;padding:6px 12px;border:1px solid #252525;border-radius:6px">&#8592; Back to PropDesk</a>
  </div>

  <div class="cs-layout">

    <!-- ─── LEFT ─────────────────────────────────────────────────── -->
    <div>
      <!-- Date filter -->
      <div class="panel">
        <span class="slabel">Date Filter</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap" id="date-pills">
          <button class="pill on" data-f="today" onclick="setDateFilter('today',this)">Today</button>
          <button class="pill" data-f="yesterday" onclick="setDateFilter('yesterday',this)">Yesterday</button>
          <button class="pill" data-f="week" onclick="setDateFilter('week',this)">Last 7 Days</button>
          <button class="pill" data-f="all" onclick="setDateFilter('all',this)">All</button>
        </div>
        <div class="sync-bar">
          <span id="sync-status" style="font-size:11px;color:#3a3a3a;flex:1">Local storage</span>
          <span id="sync-count" style="font-size:11px;color:#555;white-space:nowrap"></span>
          <button class="btn sm" id="sync-btn" onclick="syncSupabase()">Sync Supabase</button>
        </div>
      </div>

      <!-- Template selector -->
      <div class="panel">
        <span class="slabel">Post Type</span>
        <div style="display:flex;flex-wrap:wrap;gap:6px" id="tmpl-pills"></div>
        <div id="tmpl-hint" style="font-size:11px;color:#3a3a3a;margin-top:7px"></div>
      </div>

      <!-- Game filter (shown only when filtered picks contain game data) -->
      <div class="panel" id="game-filter-panel" style="display:none">
        <span class="slabel">Filter by Game</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap" id="game-pills"></div>
      </div>

      <!-- Pick list -->
      <div class="panel">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
          <span class="slabel" style="margin:0">Select Picks</span>
          <div style="display:flex;gap:5px">
            <button class="btn sm" onclick="selectAll()">All</button>
            <button class="btn sm" onclick="selectNone()">None</button>
          </div>
        </div>
        <div id="pick-count" style="font-size:11px;color:#3a3a3a;margin-bottom:4px"></div>
        <div class="picks-wrap" id="pick-list"><div class="cs-empty">Loading&hellip;</div></div>
      </div>
    </div>

    <!-- ─── RIGHT ────────────────────────────────────────────────── -->
    <div>
      <!-- Preview -->
      <div class="panel">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <span class="slabel" style="margin:0">Preview</span>
          <div style="display:flex;gap:4px">
            <button class="fmt-btn on" data-fmt="square" onclick="setFormat('square',this)">1080&times;1080</button>
            <button class="fmt-btn" data-fmt="wide" onclick="setFormat('wide',this)">1080&times;600</button>
          </div>
        </div>
        <div class="prev-outer" id="prev-outer">
          <div class="prev-container" id="prev-container">
            <div id="prev-inner"></div>
          </div>
        </div>
      </div>

      <!-- Caption -->
      <div class="panel">
        <span class="slabel">Caption</span>
        <textarea class="cap-ta" id="cap-ta" placeholder="Select a pick to generate a caption&hellip;" spellcheck="false"></textarea>
      </div>

      <!-- Actions -->
      <div style="display:flex;gap:8px">
        <button id="dl-btn" class="btn accent" style="flex:1" onclick="downloadPNG()">&darr; Download PNG</button>
        <button class="btn" style="flex:1" onclick="copyCaption()">&#10063; Copy Caption</button>
      </div>
      <div id="act-status"></div>
    </div>

  </div>
</div>

<!-- Off-screen capture target for html2canvas -->
<div id="card-render" style="position:absolute;left:-9999px;top:0;width:540px;height:540px;overflow:hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
'use strict';

/* ─── Config ──────────────────────────────────────────────────────────────── */
var PLAY_HIST_KEY = 'propdesk_user_plays';
var SUPABASE_URL  = 'https://xwmvkfhlfntjgouibftt.supabase.co';
var SUPABASE_KEY  = 'sb_publishable_RKjp7WAmXRR7YXxyu1zHIQ_MEBWPDQw';
var PASSWORD      = 'propdeskowner1';
var BRAND_URL     = 'thepropdesk.org';

/* ─── State ───────────────────────────────────────────────────────────────── */
var allPicks      = [];
var filteredPicks = [];
var selectedIds   = new Set();
var activeTmplId  = 'single-pick';
var activeFormat  = 'square';
var dateFilter    = 'today';
var gameFilter    = 'all';
var _sb           = null;

/* ─── Util helpers ────────────────────────────────────────────────────────── */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function todayISO(){ return new Date().toISOString().slice(0,10); }
function yesterdayISO(){ return new Date(Date.now()-86400000).toISOString().slice(0,10); }

function fmtDateShort(iso){
  if(!iso) return '';
  var d=new Date(iso+'T12:00:00');
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function tierColors(tier){
  var m={ELITE:{bg:'#1e1040',c:'#a78bfa'},GREAT:{bg:'#0e2818',c:'#22c55e'},GOOD:{bg:'#0e1e38',c:'#3b82f6'},VALUE:{bg:'#2a1e08',c:'#f59e0b'}};
  return m[tier]||{bg:'#1a1a1a',c:'#666'};
}

function trendAccentColor(pick){
  var raw=(pick.trendType||pick.trendSystem||'').toLowerCase();
  if(raw==='linevalue'||raw==='line value') return '#06b6d4';
  if(raw==='streak'||raw==='player streak') return '#f59e0b';
  if(raw==='homeway'||raw==='home/away split'||raw==='home/away') return '#f472b6';
  if(raw==='movement'||raw==='sharp money') return '#84cc16';
  if(raw==='matchup'||raw==='matchup system') return '#a78bfa';
  if(raw==='bullpen'||raw==='bullpen fatigue') return '#ef4444';
  if(raw==='nrfi'||raw==='first inning') return '#fb923c';
  if(raw==='game total') return '#38bdf8';
  if(raw==='team system') return '#818cf8';
  return '#00e87a';
}

/* Normalize "A vs B" / "B vs A" to a canonical sorted form so game filter
   matches regardless of which tracking path stored home/away first. */
function normalizeGame(g){
  if(!g) return '';
  var m=g.match(/^(.+?)\s+vs\.?\s+(.+)$/i);
  if(!m) return g.trim();
  var a=m[1].trim(), b=m[2].trim();
  return (a<b?a+' vs '+b:b+' vs '+a);
}

/* Resolved confidence: prop picks store p.confidence; trend picks store
   confidence:null and use trendWinRate instead. */
function _resolveConf(p){
  if(p.confidence!=null) return p.confidence;
  if(p.trendWinRate!=null) return Math.round(p.trendWinRate*100);
  return null;
}
function _resolveTier(p){
  var stored=p.tier;
  if(stored) return stored;
  var c=_resolveConf(p);
  if(c==null) return null;
  if(c>=90) return 'ELITE';
  if(c>=80) return 'GREAT';
  if(c>=70) return 'GOOD';
  if(c>=60) return 'VALUE';
  return null;
}

function trendTypeLabel(pick){
  var MAP={
    streak:'STREAK','player streak':'PLAYER STREAK',
    homeway:'HOME/AWAY','home/away split':'HOME/AWAY','home/away':'HOME/AWAY',
    linevalue:'LINE VALUE','line value':'LINE VALUE',
    movement:'SHARP MONEY','sharp money':'SHARP MONEY',
    matchup:'MATCHUP','matchup system':'MATCHUP',
    bullpen:'BULLPEN','bullpen fatigue':'BULLPEN',
    nrfi:'NRFI','first inning':'NRFI',
    'game total':'GAME TOTAL',
    'team system':'TEAM SYSTEM'
  };
  var raw=((pick.trendType||pick.trendSystem)||'trend').toLowerCase();
  return (MAP[raw]||raw.toUpperCase()).slice(0,18);
}

/* ─── Card sub-elements (inline styles only — no CSS vars) ───────────────── */
function _wordmark(sz){
  var s=sz||13;
  return '<span style="font-size:'+s+'px;font-weight:800;letter-spacing:.12em;color:#00e87a;text-transform:uppercase">PROP<span style="color:#fff">DESK</span></span>';
}

function _tierBadge(tier){
  if(!tier) return '';
  var t=tierColors(tier);
  return '<span style="background:'+t.bg+';color:'+t.c+';font-size:9px;font-weight:800;padding:3px 7px;border-radius:4px;letter-spacing:.06em;text-transform:uppercase">'+esc(tier)+'</span>';
}

function _sportBadge(sport){
  if(!sport) return '';
  return '<span style="background:#1a1a1a;color:#555;font-size:9px;font-weight:700;padding:3px 7px;border-radius:4px;letter-spacing:.06em;border:1px solid #2a2a2a">'+esc(sport)+'</span>';
}

function _confBar(conf, barW){
  var pct=Math.min(100,Math.max(0,conf||0));
  var filled=Math.round(pct*(barW||476)/100);
  var c=pct>=80?'#00e87a':pct>=65?'#f59e0b':'#ef4444';
  return '<div style="height:5px;width:'+(barW||476)+'px;background:#222;border-radius:3px;overflow:hidden"><div style="height:5px;width:'+filled+'px;background:'+c+';border-radius:3px"></div></div>';
}

/* ─── Empty card ──────────────────────────────────────────────────────────── */
function _emptyCard(fmt){
  var h=fmt==='wide'?300:540;
  return '<div style="width:540px;height:'+h+'px;background:#0a0a0a;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif"><div style="text-align:center;color:#2a2a2a"><div style="font-size:26px;margin-bottom:8px">&#128241;</div><div style="font-size:12px">No pick selected</div></div></div>';
}

/* ─────────────────────────────────────────────────────────────────────────────
   TEMPLATE REGISTRY

   To add a new post type:
   1. Write a definition object (see interface below)
   2. Call registerTemplate(def) — the UI discovers it automatically at init()

   Interface:
   {
     id:       string   — unique kebab-case key
     label:    string   — shown in pill selector
     icon:     string   — emoji prefix on pill
     minPicks: number   — minimum picks required (0 = autoLoad templates)
     maxPicks: number   — maximum selectable picks
     autoLoad: boolean  — if true, render() receives all date-filtered picks,
                          bypassing checkbox selection (used by Recap)
     formats:  string[] — subset of ['square','wide'] this template supports
     render:   function(picks, format) → HTML string (inline styles ONLY)
     caption:  function(picks) → string
   }
   ──────────────────────────────────────────────────────────────────────────── */
var TEMPLATES = {};
function registerTemplate(def){ TEMPLATES[def.id]=def; }

/* ═══════════════════════════════════════════════════════════════════════════
   TEMPLATE MODULES
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── 1. Single Pick ─────────────────────────────────────────────────────── */
registerTemplate({
  id:'single-pick', label:'Single Pick', icon:'🎯',
  minPicks:1, maxPicks:1, autoLoad:false, formats:['square','wide'],

  render: function(picks, fmt){
    var p=picks[0]; if(!p) return _emptyCard(fmt);
    var iw=(fmt==='wide'), W=540, H=iw?300:540;
    var tc=tierColors(p.tier);
    var nameSz=iw?28:42, lineSz=iw?20:30, barW=iw?380:476;
    var topPad=iw?19:31;

    return '<div style="width:'+W+'px;height:'+H+'px;background:#0a0a0a;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif">'+
      '<div style="position:absolute;top:0;left:0;right:0;height:3px;background:#00e87a"></div>'+
      '<div style="padding:'+(topPad+3)+'px 32px 0;display:flex;justify-content:space-between;align-items:center">'+
        _wordmark(iw?11:13)+
        '<div style="display:flex;gap:5px;align-items:center">'+_tierBadge(p.tier)+_sportBadge(p.sport)+'</div>'+
      '</div>'+
      '<div style="padding:'+(iw?12:22)+'px 32px 0;font-size:'+nameSz+'px;font-weight:800;color:#fff;letter-spacing:-.5px;line-height:1.05;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.player||p.team||'')+'</div>'+
      '<div style="padding:'+(iw?5:8)+'px 32px 0;font-size:'+lineSz+'px;font-weight:700;color:#00e87a;letter-spacing:-.2px">'+esc(p.line||'')+'</div>'+
      '<div style="padding:'+(iw?12:22)+'px 32px 0">'+
        '<div style="background:#111;border:1px solid #1a1a1a;border-radius:10px;padding:'+(iw?10:14)+'px 16px">'+
          '<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px">'+
            '<span style="font-size:10px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:.08em">Confidence</span>'+
            '<span style="font-size:'+(iw?22:30)+'px;font-weight:800;color:#fff;line-height:1">'+(p.confidence||'&mdash;')+'%</span>'+
          '</div>'+
          _confBar(p.confidence, barW)+
        '</div>'+
      '</div>'+
      '<div style="padding:'+(iw?8:14)+'px 32px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+
        (p.game?'<span style="font-size:12px;color:#555">'+esc(p.game)+'</span><span style="color:#1e1e1e">&middot;</span>':'')+
        (p.odds?'<span style="font-size:13px;font-weight:700;color:#888">'+esc(p.odds)+'</span><span style="color:#1e1e1e">&middot;</span>':'')+
        '<span style="font-size:11px;color:#444">'+esc(p.marketDisplay||p.market||'')+'</span>'+
      '</div>'+
      '<div style="position:absolute;bottom:0;left:0;right:0;background:#0a0a0a;padding:'+(iw?10:12)+'px 32px '+(iw?14:18)+'px;border-top:1px solid #141414;display:flex;justify-content:space-between;align-items:center">'+
        '<span style="font-size:10px;color:#252525;letter-spacing:.06em;text-transform:uppercase">'+BRAND_URL+'</span>'+
        '<span style="font-size:10px;color:#252525">'+(p.date||todayISO())+'</span>'+
      '</div>'+
    '</div>';
  },

  caption: function(picks){
    var p=picks[0]; if(!p) return '';
    var parts=[];
    parts.push((p.tier?p.tier+' PLAY: ':'PLAY: ')+p.player+' \u2014 '+(p.line||''));
    if(p.marketDisplay||p.market) parts[0]+=' ('+(p.marketDisplay||p.market)+')';
    var det=[];
    if(p.game) det.push(p.game);
    if(p.confidence) det.push(p.confidence+'% confidence');
    if(p.odds) det.push(p.odds);
    if(det.length) parts.push(det.join(' | '));
    parts.push('\nWe show our work. \ud83d\udcca');
    parts.push('#PropDesk #SportsProps'+(p.sport?' #'+p.sport:''));
    return parts.join('\n');
  }
});

/* ── 2. Multi-Pick Board ────────────────────────────────────────────────── */
registerTemplate({
  id:'multi-board', label:'Multi Board', icon:'📋',
  minPicks:2, maxPicks:5, autoLoad:false, formats:['square'],

  render: function(picks, fmt){
    if(!picks.length) return _emptyCard(fmt);
    var W=540, H=540;
    var sports={};
    picks.forEach(function(p){ if(p.sport) sports[p.sport]=(sports[p.sport]||0)+1; });
    var sport=Object.keys(sports).sort(function(a,b){return sports[b]-sports[a];})[0]||'';

    var confVals=picks.map(function(p){ return _resolveConf(p); }).filter(function(v){ return v!=null; });
    var avgConf=confVals.length?Math.round(confVals.reduce(function(s,v){return s+v;},0)/confVals.length):null;

    var rows=picks.slice(0,5).map(function(p){
      var tc=tierColors(p.tier);
      var conf=_resolveConf(p);

      '<div style="position:absolute;bottom:0;left:0;right:0;background:#0a0a0a;padding:'+(iw?10:12)+'px 32px '+(iw?12:18)+'px;border-top:1px solid #141414;display:flex;justify-content:space-between;align-items:center">'+
        '<span style="font-size:10px;color:#252525;letter-spacing:.06em;text-transform:uppercase">'+BRAND_URL+'</span>'+
        '<span style="font-size:10px;color:#252525">'+(p.date||todayISO())+'</span>'+
      '</div>'+
    '</div>';
  },

  caption: function(picks){
    var p=picks[0]; if(!p) return '';
    var team=p.player||p.team||'';
    return '\ud83d\udcb0 MONEYLINE: '+team+' '+(p.odds||'')+
      (p.game?'\n'+p.game:'')+
      '\n'+(p.confidence||'&mdash;')+'% confidence'+(p.tier?' | '+p.tier:'')+
      '\n\n#PropDesk'+(p.sport?' #'+p.sport:'');
  }
});

/* ── 8. Game Board ──────────────────────────────────────────────────────────
   All picks from one matchup, themed around the team-vs-team header.
   Best used: filter to a game pill → Select All → choose this template.
   ─────────────────────────────────────────────────────────────────────────── */
registerTemplate({
  id:'game-board', label:'Game Board', icon:'⚔️',
  minPicks:1, maxPicks:10, autoLoad:false, formats:['square'],

  render: function(picks, fmt){
    if(!picks.length) return _emptyCard(fmt);
    var W=540, H=540;
    var p0=picks[0];
    var gameStr=p0.game||'';
    var parts=gameStr.split(/\s+vs\.?\s+/i);
    var team1=parts[0]||'';
    var team2=parts[1]||'';
    var sport=p0.sport||'';
    var dt=p0.date||todayISO();

    var confVals=picks.map(function(p){ return _resolveConf(p); }).filter(function(c){ return c!==null; });
    var avgConf=confVals.length?Math.round(confVals.reduce(function(a,b){return a+b;},0)/confVals.length):null;

    var maxRows=7;
    var shown=picks.slice(0,maxRows);
    var extra=picks.length-shown.length;

    var rows=shown.map(function(p,i){
      var conf=_resolveConf(p);
      var tier=_resolveTier(p);
      var tc=tierColors(tier);
      var isEven=i%2===1;
      var isLast=i===shown.length-1&&!extra;
      return '<div style="flex:1;display:flex;align-items:center;padding:0 32px;'+
        (isEven?'background:rgba(255,255,255,0.02);':'')+
        (!isLast?'border-bottom:1px solid #1a1a1a;':'')+'">'+
        '<div style="flex:1;min-width:0">'+
          '<div style="font-size:13px;font-weight:700;color:#e8e8e8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.player||p.team||'')+'</div>'+
          '<div style="font-size:10px;color:#555;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.marketDisplay||p.market||'')+' '+esc(p.line||'')+'</div>'+
          '<div style="margin-top:7px;width:72px;height:3px;background:#111;border-radius:2px;overflow:hidden">'+
            (conf!==null?'<div style="height:100%;background:#00e87a;width:'+conf+'%"></div>':'')+
          '</div>'+
        '</div>'+
        '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0">'+
          (conf!==null?'<div style="font-size:13px;font-weight:800;color:#00e87a">'+conf+'%</div>':'')+
          (tier?'<span style="background:'+tc.bg+';color:'+tc.c+';font-size:8px;font-weight:800;padding:1px 5px;border-radius:3px;letter-spacing:.04em">'+esc(tier)+'</span>':'')+
        '</div>'+
      '</div>';
    }).join('');

    return '<div style="width:'+W+'px;height:'+H+'px;background:#0a0a0a;overflow:hidden;display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif">'+
      '<div style="height:3px;background:#00e87a;flex-shrink:0"></div>'+
      '<div style="padding:22px 32px 0;display:flex;justify-content:space-between;align-items:center;flex-shrink:0">'+
        _wordmark(13)+
        '<div style="display:flex;gap:5px;align-items:center">'+
          '<span style="background:#111;border:1px solid #1a1a1a;color:#3a3a3a;font-size:9px;font-weight:700;padding:3px 7px;border-radius:4px;letter-spacing:.04em">'+esc(fmtDateShort(dt))+'</span>'+
          _sportBadge(sport)+
        '</div>'+
      '</div>'+
      '<div style="padding:14px 32px 0;flex-shrink:0">'+
        '<div style="display:flex;align-items:center;gap:10px">'+
          '<div style="font-size:20px;font-weight:900;color:#fff;letter-spacing:-.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(team1)+'</div>'+
          '<div style="font-size:10px;font-weight:800;color:#3a3a3a;flex-shrink:0;letter-spacing:.08em">VS</div>'+
          '<div style="font-size:20px;font-weight:900;color:#fff;letter-spacing:-.5px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right">'+esc(team2)+'</div>'+
        '</div>'+
        '<div style="height:1px;background:#1a1a1a;margin-top:12px"></div>'+
      '</div>'+
      '<div style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column">'+
        rows+
        (extra?'<div style="padding:4px 32px;font-size:10px;color:#333">+'+extra+' more</div>':'')+
      '</div>'+
      '<div style="padding:10px 32px;border-top:1px solid #141414;display:flex;align-items:center;justify-content:space-between;flex-shrink:0">'+
        '<span style="font-size:10px;font-weight:700;color:#3a3a3a;letter-spacing:.06em;text-transform:uppercase">'+picks.length+' PICK'+(picks.length!==1?'S':'')+'</span>'+
        (avgConf!==null?
          '<div style="display:flex;align-items:center;gap:8px">'+
            '<div style="width:80px;height:3px;background:#111;border-radius:2px;overflow:hidden">'+
              '<div style="height:100%;background:#00e87a;width:'+avgConf+'%"></div>'+
            '</div>'+
            '<span style="font-size:10px;color:#3a3a3a">'+avgConf+'% avg conf</span>'+
          '</div>'
        :'')+
      '</div>'+
      '<div style="padding:12px 32px 18px;border-top:1px solid #0f0f0f;display:flex;justify-content:space-between;align-items:center;flex-shrink:0">'+
        '<span style="font-size:10px;color:#252525;letter-spacing:.06em;text-transform:uppercase">'+BRAND_URL+'</span>'+
        '<span style="font-size:10px;color:#252525">'+dt+'</span>'+
      '</div>'+
    '</div>';
  },

  caption: function(picks){
    if(!picks.length) return '';
    var p0=picks[0];
    var game=p0.game||'Matchup';
    var lines=picks.slice(0,5).map(function(p){
      var conf=_resolveConf(p);
      return (p.player||p.team||'')+' '+(p.line||'')+(conf?' ('+conf+'%)':'');
    });
    return '⚔️ GAME BOARD: '+game+'\n\n'+lines.join('\n')+(picks.length>5?'\n+more':'')+
      '\n\nAll picks backed by data. 📊\n\n#PropDesk'+(p0.sport?' #'+p0.sport:'');
  }
});

/* ═══════════════════════════════════════════════════════════════════════════
   DATA LAYER
   ═══════════════════════════════════════════════════════════════════════════ */

function loadLocalPicks(){
  try{ return JSON.parse(localStorage.getItem(PLAY_HIST_KEY)||'[]'); }
  catch(e){ return []; }
}

function syncSupabase(){
  var btn=document.getElementById('sync-btn');
  var stat=document.getElementById('sync-status');
  if(btn){btn.disabled=true;btn.textContent='Syncing\u2026';}
  stat.textContent='Connecting\u2026';

  if(!_sb){
    try{ _sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }
    catch(e){ stat.textContent='Supabase unavailable'; if(btn){btn.disabled=false;btn.textContent='Sync Supabase';} return; }
  }

  _sb.auth.getSession().then(function(res){
    var session=res&&res.data&&res.data.session;
    if(!session){
      stat.textContent='No active session \u2014 open PropDesk and sign in first.';
      if(btn){btn.disabled=false;btn.textContent='Sync Supabase';}
      return;
    }
    var uid=session.user.id;
    _sb.from('plays').select('*').eq('user_id',uid).order('logged_at',{ascending:false}).then(function(res2){
      if(res2.error){ stat.textContent='Sync failed: '+(res2.error.message||'unknown'); if(btn){btn.disabled=false;btn.textContent='Sync Supabase';} return; }
      var rows=(res2.data||[]).map(_sbMap);
      localStorage.setItem(PLAY_HIST_KEY,JSON.stringify(rows));
      allPicks=rows;
      document.getElementById('sync-count').textContent=rows.length+' picks';
      stat.textContent='Synced from Supabase';
      applyDateFilter();
      if(btn){btn.disabled=false;btn.textContent='Sync Supabase';}
    });
  });
}

function _sbMap(r){
  return {
    date:r.date||'',player:r.player||'',market:r.market||'',
    marketDisplay:r.market_display||null,sport:r.sport||null,
    line:r.line||null,confidence:r.confidence||null,tier:r.tier||null,
    result:r.result||'pending',game:r.game||null,type:r.type||null,
    odds:r.odds||null,source:r.source||'manual',
    trendType:r.trend_type||null,trendSignal:r.trend_signal||null,
    trendRecord:r.trend_record||null,trendWinRate:r.trend_win_rate||null,
    trendSystem:r.trend_system||null,trendDescription:r.trend_description||null,
    trendSampleSize:r.trend_sample_size||null,loggedAt:r.logged_at
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   UI STATE
   ═══════════════════════════════════════════════════════════════════════════ */

function setDateFilter(f, btn){
  dateFilter=f;
  document.querySelectorAll('#date-pills .pill').forEach(function(b){ b.classList.toggle('on',b.dataset.f===f); });
  applyDateFilter();
}

function setGameFilter(g){
  gameFilter=g;
  selectedIds.clear();
  rebuildGamePills();
  renderPickList();
  updatePreview();
}

function rebuildGamePills(){
  var seen={};
  filteredPicks.forEach(function(p){ if(p.game) seen[normalizeGame(p.game)]=true; });
  var games=Object.keys(seen).sort();

  if(gameFilter!=='all'&&!seen[gameFilter]) gameFilter='all';

  var el=document.getElementById('game-pills');
  var panel=document.getElementById('game-filter-panel');
  if(!el) return;

  if(!games.length){ if(panel) panel.style.display='none'; return; }
  if(panel) panel.style.display='';
  el.innerHTML='';

  [['all','All Games']].concat(games.map(function(g){ return [g,g]; }))
    .forEach(function(pair){
      var g=pair[0], label=pair[1];
      var btn=document.createElement('button');
      btn.className='pill'+(gameFilter===g?' on':'');
      btn.dataset.g=g;
      btn.textContent=label;
      btn.onclick=function(){ setGameFilter(g); };
      el.appendChild(btn);
    });
}

function applyDateFilter(){
  var t=todayISO(), y=yesterdayISO();
  var w7iso=new Date(Date.now()-7*86400000).toISOString().slice(0,10);
  filteredPicks=allPicks.filter(function(p){
    if(dateFilter==='today') return p.date===t;
    if(dateFilter==='yesterday') return p.date===y;
    if(dateFilter==='week') return p.date>=w7iso;
    return true;
  });
  rebuildGamePills();
  renderPickList();
  updatePreview();
}

function setTemplate(id){
  activeTmplId=id;
  selectedIds.clear();
  document.querySelectorAll('#tmpl-pills .pill').forEach(function(b){ b.classList.toggle('on',b.dataset.tmpl===id); });
  var tmpl=TEMPLATES[id];
  var hint=document.getElementById('tmpl-hint');
  if(tmpl){
    if(tmpl.autoLoad) hint.textContent='Auto-populates from yesterday\'s tracked picks \u2014 no selection needed.';
    else if(tmpl.maxPicks===1) hint.textContent='Select 1 pick from the list below.';
    else hint.textContent='Select '+tmpl.minPicks+'\u2013'+tmpl.maxPicks+' picks from the list below.';
  }
  renderPickList();
  updatePreview();
}

function setFormat(fmt, btn){
  activeFormat=fmt;
  document.querySelectorAll('.fmt-btn').forEach(function(b){ b.classList.toggle('on',b.dataset.fmt===fmt); });
  var render=document.getElementById('card-render');
  render.style.height=(fmt==='wide'?300:540)+'px';
  updatePreview();
}

function getSelectedPicks(){
  if(!selectedIds.size) return [];
  return filteredPicks.filter(function(p){ return selectedIds.has(p.loggedAt); });
}

function gameFiltered(){
  if(gameFilter==='all') return filteredPicks;
  var teams=gameFilter.split(' vs ');
  if(teams.length!==2) return filteredPicks.filter(function(p){ return p.game===gameFilter; });
  var t0=teams[0].toLowerCase(), t1=teams[1].toLowerCase();
  return filteredPicks.filter(function(p){
    if(!p.game) return false;
    var gl=p.game.toLowerCase();
    return gl.indexOf(t0)!==-1 && gl.indexOf(t1)!==-1;
  });
}

function renderPickList(){
  var el=document.getElementById('pick-list');
  var countEl=document.getElementById('pick-count');
  var tmpl=TEMPLATES[activeTmplId];

  if(tmpl&&tmpl.autoLoad){
    var yest=yesterdayISO();
    var yd=allPicks.filter(function(p){ return p.date===yest; });
    el.innerHTML='<div style="padding:12px 4px;color:#3a3a3a;font-size:12px;text-align:center">'+
      'Recap auto-loads yesterday\'s picks.<br>('+yd.length+' found for '+fmtDateShort(yest)+')'+
    '</div>';
    countEl.textContent='';
    return;
  }

  var viewPicks=gameFiltered();

  // When a specific game is active, log excluded picks so the game field is visible in console
  if(gameFilter!=='all'){
    var excluded=filteredPicks.filter(function(p){ return !viewPicks.includes(p); });
    if(excluded.length){
      console.log('[ContentStudio] Game filter "'+gameFilter+'" excluded '+excluded.length+' pick(s):');
      excluded.forEach(function(p){ console.log('  '+esc(p.player||p.team||'?')+' | p.game='+JSON.stringify(p.game)); });
    }
  }

  if(!viewPicks.length){
    el.innerHTML='<div class="cs-empty">'+(gameFilter==='all'?'No picks for this date range':'No picks for this game')+'</div>';
    countEl.textContent='';
    return;
  }

  var noGameCount=gameFilter==='all'?0:filteredPicks.filter(function(p){ return !p.game; }).length;
  var noGameNote=noGameCount?' \u00b7 <span title="These picks have no game field stored \u2014 re-track them to assign a game" style="color:#555;font-style:italic">'+noGameCount+' no-game-data</span>':'';
  countEl.innerHTML=viewPicks.length+' pick'+(viewPicks.length!==1?'s':'')+' \u00b7 '+selectedIds.size+' selected'+noGameNote;

  el.innerHTML=viewPicks.map(function(p){
    var sel=selectedIds.has(p.loggedAt);
    var res=p.result||'pending';
    var resLabel=res==='hit'?'HIT \u2713':res==='miss'?'MISS \u2717':'PENDING';
    var isTrend=p.source==='trend'||p.type==='trend';
    var tag=isTrend?' <span style="font-size:9px;color:#3a3a3a">['+trendTypeLabel(p)+']</span>':'';
    return '<div class="pick-row'+(sel?' sel':'')+'" onclick="togglePick('+p.loggedAt+')">'+
      '<input type="checkbox" '+(sel?'checked':'')+' onclick="event.stopPropagation();togglePick('+p.loggedAt+')">'+
      '<div class="p-name">'+esc(p.player||p.team||'\u2014')+tag+'</div>'+
      '<div class="p-line">'+esc(p.line||'')+'</div>'+
      '<div class="p-conf">'+(_resolveConf(p)!=null?_resolveConf(p):'—')+'%</div>'+
      '<div class="p-res '+res+'">'+resLabel+'</div>'+
    '</div>';
  }).join('');
}

function togglePick(loggedAt){
  var tmpl=TEMPLATES[activeTmplId];
  var max=tmpl?tmpl.maxPicks:1;
  if(selectedIds.has(loggedAt)){
    selectedIds.delete(loggedAt);
  } else {
    if(selectedIds.size>=max){
      if(max===1){ selectedIds.clear(); } else { return; }
    }
    selectedIds.add(loggedAt);
  }
  renderPickList();
  updatePreview();
}

function selectAll(){
  var tmpl=TEMPLATES[activeTmplId];
  if(tmpl&&tmpl.autoLoad) return;
  var max=tmpl?tmpl.maxPicks:1;
  selectedIds.clear();
  gameFiltered().slice(0,max).forEach(function(p){ selectedIds.add(p.loggedAt); });
  renderPickList();
  updatePreview();
}

function selectNone(){
  selectedIds.clear();
  renderPickList();
  updatePreview();
}

function updatePreview(){
  var tmpl=TEMPLATES[activeTmplId];
  if(!tmpl) return;
  var picks=tmpl.autoLoad?allPicks:getSelectedPicks();
  var html=tmpl.render(picks,activeFormat);
  var cardH=activeFormat==='wide'?300:540;

  // Update off-screen render target
  var render=document.getElementById('card-render');
  render.style.width='540px';
  render.style.height=cardH+'px';
  render.innerHTML=html;

  // Update visible preview
  var outer=document.getElementById('prev-outer');
  var container=document.getElementById('prev-container');
  var inner=document.getElementById('prev-inner');
  var availW=Math.max(200, outer.clientWidth-40);
  var scale=Math.min(1, availW/540);
  var sw=Math.round(540*scale), sh=Math.round(cardH*scale);

  container.style.width=sw+'px';
  container.style.height=sh+'px';
  inner.style.width='540px';
  inner.style.height=cardH+'px';
  inner.style.transform='scale('+scale+')';
  inner.innerHTML=html;
  outer.style.minHeight=(sh+40)+'px';

  // Update caption
  document.getElementById('cap-ta').value=tmpl.caption(picks);
}

/* ═══════════════════════════════════════════════════════════════════════════
   EXPORT
   ═══════════════════════════════════════════════════════════════════════════ */

function downloadPNG(){
  var render=document.getElementById('card-render');
  if(!render.firstElementChild){ showStatus('Select a pick first'); return; }
  var dlBtn=document.getElementById('dl-btn');
  if(dlBtn){dlBtn.disabled=true;dlBtn.innerHTML='&#8987; Generating\u2026';}
  showStatus('');
  setTimeout(function(){
    html2canvas(render.firstElementChild,{
      scale:2,
      useCORS:false,
      allowTaint:true,
      logging:false
    }).then(function(canvas){
      if(canvas.width<500||canvas.height<200){
        throw new Error('Render incomplete ('+canvas.width+'\u00d7'+canvas.height+'px) \u2014 scroll up to show the preview and try again');
      }
      var tmpl=TEMPLATES[activeTmplId];
      var picks=tmpl&&tmpl.autoLoad?allPicks:getSelectedPicks();
      var nameBase=(picks[0]&&(picks[0].player||picks[0].team)||'propdesk-card')
        .toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\-]/g,'');
      var link=document.createElement('a');
      link.download='propdesk-'+nameBase+'-'+todayISO()+'.png';
      link.href=canvas.toDataURL('image/png');
      link.click();
      showStatus('Downloaded \u2713');
      if(dlBtn){dlBtn.disabled=false;dlBtn.innerHTML='&darr; Download PNG';}
    }).catch(function(e){
      showStatus('Export failed: '+(e&&e.message||String(e)),true);
      if(dlBtn){dlBtn.disabled=false;dlBtn.innerHTML='&darr; Download PNG';}
    });
  },160);
}

function copyCaption(){
  var txt=document.getElementById('cap-ta').value;
  if(!txt){ showStatus('No caption'); return; }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){showStatus('Copied \u2713');}).catch(function(){ fallbackCopy(txt); });
  } else { fallbackCopy(txt); }
}

function fallbackCopy(txt){
  var ta=document.createElement('textarea');
  ta.value=txt; ta.style.cssText='position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select(); document.execCommand('copy');
  document.body.removeChild(ta); showStatus('Copied \u2713');
}

function showStatus(msg,withRetry){
  var el=document.getElementById('act-status');
  if(withRetry){
    el.innerHTML='<span style="color:#f5a623">'+esc(msg)+'</span>'+
      ' <button class="btn sm" onclick="downloadPNG()" style="margin-left:6px;border-color:#f5a62355;color:#f5a623">Retry</button>';
  } else {
    el.textContent=msg||'';
    if(msg){ var snap=msg; setTimeout(function(){ if(el.textContent===snap) el.textContent=''; },3000); }
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════════════════════ */

document.getElementById('pwInput').addEventListener('keydown',function(e){ if(e.key==='Enter') checkPw(); });

function checkPw(){
  if(document.getElementById('pwInput').value===PASSWORD){
    document.getElementById('gate').style.display='none';
    document.getElementById('main').style.display='block';
    init();
  } else {
    document.getElementById('pwErr').style.display='block';
    document.getElementById('pwInput').value='';
  }
}

function init(){
  // Build template pills
  var pillsEl=document.getElementById('tmpl-pills');
  Object.values(TEMPLATES).forEach(function(tmpl){
    var btn=document.createElement('button');
    btn.className='pill'+(tmpl.id===activeTmplId?' on':'');
    btn.dataset.tmpl=tmpl.id;
    btn.textContent=tmpl.icon+' '+tmpl.label;
    btn.onclick=function(){ setTemplate(tmpl.id); };
    pillsEl.appendChild(btn);
  });

  // Load picks
  allPicks=loadLocalPicks();
  var cnt=document.getElementById('sync-count');
  if(cnt) cnt.textContent=allPicks.length+' picks';

  // Initial template hint
  document.getElementById('tmpl-hint').textContent='Select 1 pick from the list below.';

  // Init Supabase client (no auth yet — only used on sync)
  try{ _sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }catch(e){}

  // Apply state
  applyDateFilter();
  setTemplate(activeTmplId);
}
